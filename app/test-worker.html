<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGA API Worker Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .result pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }

        .loading.active {
            display: block;
        }

        .error {
            background: #fee;
            border-left: 4px solid #e53e3e;
            padding: 10px;
            border-radius: 4px;
            color: #742a2a;
        }

        .success {
            background: #efe;
            border-left: 4px solid #38a169;
            padding: 10px;
            border-radius: 4px;
            color: #22543d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 NGA API Worker Test</h1>

        <!-- Worker URL Config -->
        <div class="card">
            <h2>⚙️ Cấu hình</h2>
            <div class="form-group">
                <label for="workerUrl">Worker URL:</label>
                <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev" value="http://localhost:8787">
            </div>
        </div>

        <!-- Subject List Test -->
        <div class="card">
            <h2>📋 Test Subject List</h2>
            <div class="form-group">
                <label for="fid">Forum ID (fid):</label>
                <input type="text" id="fid" placeholder="123" value="-7">
            </div>
            <div class="form-group">
                <label for="page1">Page:</label>
                <input type="number" id="page1" placeholder="1" value="1">
            </div>
            <div class="form-group">
                <label for="act">Action:</label>
                <select id="act">
                    <option value="list">list</option>
                    <option value="hot">hot</option>
                    <option value="topped">topped</option>
                </select>
            </div>
            <button onclick="testSubjectList()">🔍 Test Subject List</button>
            <div class="loading" id="loading1">⏳ Loading...</div>
            <div class="result" id="result1"></div>
        </div>

        <!-- Search Threads Test -->
        <div class="card">
            <h2>🔎 Test Search Threads</h2>
            <div class="form-group">
                <label for="keyword1">Keyword:</label>
                <input type="text" id="keyword1" placeholder="game" value="游戏">
            </div>
            <div class="form-group">
                <label for="page2">Page:</label>
                <input type="number" id="page2" placeholder="1" value="1">
            </div>
            <button onclick="testSearchThreads()">🔍 Test Search Threads</button>
            <div class="loading" id="loading2">⏳ Loading...</div>
            <div class="result" id="result2"></div>
        </div>

        <!-- Search Forums Test -->
        <div class="card">
            <h2>🏛️ Test Search Forums</h2>
            <div class="form-group">
                <label for="keyword2">Keyword:</label>
                <input type="text" id="keyword2" placeholder="game" value="游戏">
            </div>
            <div class="form-group">
                <label for="page3">Page:</label>
                <input type="number" id="page3" placeholder="1" value="1">
            </div>
            <button onclick="testSearchForums()">🔍 Test Search Forums</button>
            <div class="loading" id="loading3">⏳ Loading...</div>
            <div class="result" id="result3"></div>
        </div>

        <!-- Thread Posts Test -->
        <div class="card">
            <h2>💬 Test Thread Posts</h2>
            <div class="form-group">
                <label for="tid">Thread ID (tid):</label>
                <input type="text" id="tid" placeholder="12345" value="37680782">
            </div>
            <div class="form-group">
                <label for="page4">Page:</label>
                <input type="number" id="page4" placeholder="1" value="1">
            </div>
            <button onclick="testThreadPosts()">🔍 Test Thread Posts</button>
            <div class="loading" id="loading4">⏳ Loading...</div>
            <div class="result" id="result4"></div>
        </div>
    </div>

    <script>
        function getWorkerUrl() {
            return document.getElementById('workerUrl').value;
        }

        function showLoading(id) {
            document.getElementById(`loading${id}`).classList.add('active');
        }

        function hideLoading(id) {
            document.getElementById(`loading${id}`).classList.remove('active');
        }

        function showResult(id, data, isError = false) {
            const resultDiv = document.getElementById(`result${id}`);
            const className = isError ? 'error' : 'success';
            resultDiv.innerHTML = `<div class="${className}"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }

        async function testSubjectList() {
            const fid = document.getElementById('fid').value;
            const page = document.getElementById('page1').value;
            const act = document.getElementById('act').value;
            const url = `${getWorkerUrl()}/subject-list?fid=${fid}&page=${page}&act=${act}`;

            showLoading(1);
            try {
                const response = await fetch(url);
                const data = await response.json();
                hideLoading(1);
                showResult(1, data, data.error);
            } catch (error) {
                hideLoading(1);
                showResult(1, { error: error.message }, true);
            }
        }

        async function testSearchThreads() {
            const keyword = document.getElementById('keyword1').value;
            const page = document.getElementById('page2').value;
            const url = `${getWorkerUrl()}/search-threads?keyword=${encodeURIComponent(keyword)}&page=${page}`;

            showLoading(2);
            try {
                const response = await fetch(url);
                const data = await response.json();
                hideLoading(2);
                showResult(2, data, data.error);
            } catch (error) {
                hideLoading(2);
                showResult(2, { error: error.message }, true);
            }
        }

        async function testSearchForums() {
            const keyword = document.getElementById('keyword2').value;
            const page = document.getElementById('page3').value;
            const url = `${getWorkerUrl()}/search-forums?keyword=${encodeURIComponent(keyword)}&page=${page}`;

            showLoading(3);
            try {
                const response = await fetch(url);
                const data = await response.json();
                hideLoading(3);
                showResult(3, data, data.error);
            } catch (error) {
                hideLoading(3);
                showResult(3, { error: error.message }, true);
            }
        }

        async function testThreadPosts() {
            const tid = document.getElementById('tid').value;
            const page = document.getElementById('page4').value;
            const url = `${getWorkerUrl()}/thread-posts?tid=${tid}&page=${page}`;

            showLoading(4);
            try {
                const response = await fetch(url);
                const data = await response.json();
                hideLoading(4);
                showResult(4, data, data.error);
            } catch (error) {
                hideLoading(4);
                showResult(4, { error: error.message }, true);
            }
        }
    </script>
</body>
</html>
